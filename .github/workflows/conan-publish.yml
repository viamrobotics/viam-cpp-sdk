name: Publish conan packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
        description: Version number (eg 0.20.1)
      upload_deps:
        required: true
        type: boolean
        default: false
        description: If true, publish slow-building deps as well
      lockfile_release_update:
        required: true
        type: boolean
        default: false
        description: If true, add a conan.lock artifact to the draft release
      upload_relwithdebinfo:
        required: true
        type: boolean
        default: true
        description: If true, also publish a RelWithDebInfo build of the SDK (deps stay Release)

permissions:
  contents: read

jobs:
  # A release event carries no inputs; it publishes with the lockfile and RelWithDebInfo, without deps.
  params:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.params.outputs.version }}
      upload_deps: ${{ steps.params.outputs.upload_deps }}
      lockfile_release_update: ${{ steps.params.outputs.lockfile_release_update }}
      upload_relwithdebinfo: ${{ steps.params.outputs.upload_relwithdebinfo }}
    steps:
      - id: params
        env:
          REF: ${{ inputs.ref || github.event.release.tag_name }}
          UPLOAD_DEPS: ${{ inputs.upload_deps || false }}
          LOCKFILE_RELEASE_UPDATE: ${{ github.event_name == 'release' || inputs.lockfile_release_update }}
          UPLOAD_RELWITHDEBINFO: ${{ github.event_name == 'release' || inputs.upload_relwithdebinfo }}
        run: |
          version="${REF#releases/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REF' is not a version (eg 0.20.1) or a releases/vX.Y.Z tag"
            exit 1
          fi
          {
            echo "version=$version"
            echo "upload_deps=$UPLOAD_DEPS"
            echo "lockfile_release_update=$LOCKFILE_RELEASE_UPDATE"
            echo "upload_relwithdebinfo=$UPLOAD_RELWITHDEBINFO"
          } >> "$GITHUB_OUTPUT"

  build_macos:
    needs: params
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: releases/v${{ needs.params.outputs.version }}


      - name: Install dependencies
        run: |
          cmake --version
          python --version
          ninja --version
          brew install buf
          python -m pip install conan

      - name: Set up python/conan
        env:
          CONAN_REMOTE_URL: ${{ secrets.conanRemote }}
          CONAN_LOGIN_USERNAME_VIAMCONAN: ${{ secrets.conanUsername}}
          CONAN_PASSWORD_VIAMCONAN: ${{ secrets.conanPassword }}
        run: |
          conan profile detect
          conan remote add viamconan $CONAN_REMOTE_URL
          conan remote auth --force -cc core:non_interactive=True viamconan

      - name: Set lockfile update arguments
        if: needs.params.outputs.lockfile_release_update == 'true'
        run: echo "LOCKFILE_UPDATE_ARGS=--lockfile-out conan.lock --lockfile-clean" >> $GITHUB_ENV

      - name: Create and upload package
        run: |
          # `buf` tries to read a CLI config file that we don't actually use located at
          # ~/.config/buf/config.yaml. We don't always have permission to access this
          # directory in CI, so we set the `BUF_CONFIG_DIR` to some other value that we
          # do have permissions for. See https://github.com/bufbuild/buf/issues/2698 for
          # more details.
          export BUF_CONFIG_DIR=$(mktemp -d)

          conan lock add --requires=viam-cpp-sdk/${{ needs.params.outputs.version }}

          conan create . --build=missing -pr:a etc/conan/macos.profile \
          --lockfile etc/conan/conan.lock $LOCKFILE_UPDATE_ARGS

          # No lockfile-out: must not rewrite the release lock.
          if [ "${{ needs.params.outputs.upload_relwithdebinfo }}" = "true" ]; then
            conan create . --build=missing -pr:a etc/conan/macos.profile \
              --lockfile etc/conan/conan.lock \
              -s:a "viam-cpp-sdk/*:build_type=RelWithDebInfo"
          fi

          # One upload pushes both build_types now in the cache (RWDI only if built).
          conan upload "viam-cpp-sdk/*" -r viamconan -c

      - name: Upload lockfile artifact
        if: needs.params.outputs.lockfile_release_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conan-lockfile-macos-latest
          path: conan.lock

      - name: Upload additional deps
        if: needs.params.outputs.upload_deps == 'true'
        run: |
          conan upload "boost/*" -r viamconan -c
          conan upload "abseil/*" -r viamconan -c
          conan upload "grpc/*" -r viamconan -c
          conan upload "protobuf/*" -r viamconan -c
          conan upload "opentelemetry-cpp/*" -r viamconan -c
          conan upload "re2/*" -r viamconan -c


  build_linux:
    needs: params
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-large, github-linux-arm64-8core]
        image:
          - ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
          - ghcr.io/viamrobotics/cpp-sdk-conan-debian:bookworm
          - ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:focal
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: releases/v${{ needs.params.outputs.version }}

    - name: Show platform info
      run: |
        uname -a
        cat /etc/os-release

    - name: Read locked b2 version
      run: echo "B2_REF=$(grep -oE '"b2/[0-9.]+' etc/conan/conan.lock | head -1 | tr -d '"')" >> "$GITHUB_ENV"

    - name: Authenticate viam conan remote
      env:
        CONAN_LOGIN_USERNAME_VIAMCONAN: ${{ secrets.conanUsername}}
        CONAN_PASSWORD_VIAMCONAN: ${{ secrets.conanPassword }}
      run: |
        conan remote auth --force -cc core:non_interactive=True viamconan

    # b2's package_id ignores the compiler, so conancenter's binary (newer glibc) would match
    # focal. Take the locked b2 from viamconan, building only if it has no binary; fall back to
    # a source build from conancenter's recipe for a version viamconan has never seen.
    - name: Pre-install b2 (focal)
      if: contains(matrix.image, 'focal')
      run: |
        conan install --tool-requires="$B2_REF" -r viamconan --build=missing -pr:a default \
            --lockfile etc/conan/conan.lock --lockfile-partial \
        || conan install --tool-requires="$B2_REF" -r conancenter --build="$B2_REF" -pr:a default \
            --lockfile etc/conan/conan.lock --lockfile-partial

    # b2's package_id ignores the compiler, so every Linux leg shares one id and the
    # first upload wins for all. Only the lowest-glibc leg may upload it, and it goes
    # first so no later blanket upload can slip a foreign b2 in ahead of it.
    - name: Upload b2 (focal)
      if: needs.params.outputs.upload_deps == 'true' && contains(matrix.image, 'focal')
      run: |
        conan upload "b2/*" -r viamconan -c

    - name: Set lockfile update arguments
      if: needs.params.outputs.lockfile_release_update == 'true'
      run: echo "LOCKFILE_UPDATE_ARGS=--lockfile-out conan.lock --lockfile-clean" >> $GITHUB_ENV

    - name: Create and upload package
      run: |
        conan lock add --requires=viam-cpp-sdk/${{ needs.params.outputs.version }}

        conan create . --build=missing -pr:a default \
          --lockfile etc/conan/conan.lock $LOCKFILE_UPDATE_ARGS

        # No lockfile-out: must not rewrite the release lock.
        if [ "${{ needs.params.outputs.upload_relwithdebinfo }}" = "true" ]; then
          conan create . --build=missing -pr:a default \
            --lockfile etc/conan/conan.lock \
            -s:a "viam-cpp-sdk/*:build_type=RelWithDebInfo"
        fi

        # One upload pushes both build_types now in the cache (RWDI only if built).
        conan upload "viam-cpp-sdk/*" -r viamconan -c

    - name: Sanitize image name for artifact
      if: needs.params.outputs.lockfile_release_update == 'true'
      env:
        IMAGE_NAME: "${{ matrix.image }}"
      run: |
        echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr ':/' '--')" >> "$GITHUB_ENV"

    - name: Upload lockfile artifact
      if: needs.params.outputs.lockfile_release_update == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: conan-lockfile-${{ matrix.runner }}-${{ env.IMAGE_NAME }}
        path: conan.lock

    - name: Upload additional deps
      if: needs.params.outputs.upload_deps == 'true'
      run: |
        conan upload "boost/*" -r viamconan -c
        conan upload "abseil/*" -r viamconan -c
        conan upload "grpc/*" -r viamconan -c
        conan upload "protobuf/*" -r viamconan -c
        conan upload "opentelemetry-cpp/*" -r viamconan -c
        conan upload "c-ares/*" -r viamconan -c
        conan upload "libbacktrace/*" -r viamconan -c
        conan upload "re2/*" -r viamconan -c
        conan upload "openssl/*" -r viamconan -c
        conan upload "zlib/*" -r viamconan -c
        conan upload "bzip2/*" -r viamconan -c

  build_windows:
    needs: params
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: releases/v${{ needs.params.outputs.version }}

    - name: Install dependencies
      run: choco install -y conan git

    - name: Set up python/conan
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
        refreshenv

        conan profile detect

        conan remote add viamconan $env:CONAN_REMOTE_URL
        conan remote auth --force -cc core:non_interactive=True viamconan
      env:
        CONAN_REMOTE_URL: ${{ secrets.conanRemote }}
        CONAN_LOGIN_USERNAME_VIAMCONAN: ${{ secrets.conanUsername}}
        CONAN_PASSWORD_VIAMCONAN: ${{ secrets.conanPassword }}
        CONAN_USER_HOME: c:/cache
        CONAN_USER_HOME_SHORT: c:/cache/conan_shortpaths

    - name: Create and upload package
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
        refreshenv

        conan create . --build=missing -s:a compiler.cppstd=17 --lockfile etc/conan/conan.lock --lockfile-partial

        if ('${{ needs.params.outputs.upload_relwithdebinfo }}' -eq 'true') {
          conan create . --build=missing -s:a compiler.cppstd=17 `
            --lockfile etc/conan/conan.lock --lockfile-partial `
            -s:a "viam-cpp-sdk/*:build_type=RelWithDebInfo"
        }

        # One upload pushes both build_types now in the cache (RWDI only if built).
        conan upload "viam-cpp-sdk/*" -r viamconan -c
      env:
        CONAN_USER_HOME: c:/cache
        CONAN_USER_HOME_SHORT: c:/cache/conan_shortpaths

    - name: Upload additional deps
      if: needs.params.outputs.upload_deps == 'true'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
        refreshenv

        conan upload "boost/*" -r viamconan -c
        conan upload "abseil/*" -r viamconan -c
        conan upload "grpc/*" -r viamconan -c
        conan upload "protobuf/*" -r viamconan -c
        conan upload "opentelemetry-cpp/*" -r viamconan -c
        conan upload "re2/*" -r viamconan -c
      env:
        CONAN_USER_HOME: c:/cache
        CONAN_USER_HOME_SHORT: c:/cache/conan_shortpaths

  merge_lockfiles:
    needs: [params, build_macos, build_linux]
    if: needs.params.outputs.lockfile_release_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: releases/v${{ needs.params.outputs.version }}
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Download lockfile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: conan-lockfile-*
          path: lockfiles

      - name: Install Conan
        run: |
          python3 -m pip install conan

      - name: Merge lockfiles
        run: |
          cd lockfiles
          # List all downloaded lockfiles
          ls -R

          # Merge all lockfiles into a single merged lockfile
          LOCKFILE_ARGS=$(find . -name "conan.lock" -type f | sed 's|^|--lockfile |')
          conan lock merge $LOCKFILE_ARGS
          cat conan.lock

      - name: Upload merged lockfile to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: releases/v${{ needs.params.outputs.version }}
          files: lockfiles/conan.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
